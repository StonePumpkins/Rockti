<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎸 摇滚人格测试 - 你最像哪个摇滚传奇？</title>
    <style>
        :root {
            --bg: #0f0f13;
            --card-bg: #1c1c24;
            --accent: #ff5e2c;
            --accent2: #ff9f4b;
            --text: #e8e8f0;
            --text2: #a0a0b8;
            --bar-bg: #2a2a38;
            --option-bg: #252530;
            --option-hover: #2f2f3e;
            --selected: #3b2025;
            --border-glow: 0 0 20px rgba(255, 94, 44, 0.4);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(ellipse at 50% 30%, rgba(255, 94, 44, 0.08) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 70%, rgba(255, 159, 75, 0.06) 0%, transparent 60%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px);
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* GitHub 图标 */
        .github-link {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(20, 20, 28, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 94, 44, 0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .github-link:hover {
            border-color: #ff5e2c;
            box-shadow: 0 0 18px rgba(255, 94, 44, 0.7);
            transform: scale(1.08);
        }
        .github-link svg {
            width: 24px;
            height: 24px;
            fill: #e8e8f0;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 48px 44px 44px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 94, 44, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all var(--transition);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }
        .header .icon-row {
            font-size: 54px;
            letter-spacing: 5px;
            margin-bottom: 10px;
            animation: pulseIcon 2s ease-in-out infinite;
        }
        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(255,94,44,0.4)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 16px rgba(255,94,44,0.8)); }
        }
        .header h1 {
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ff6b4a, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 8px;
            text-transform: uppercase;
        }
        .header .subtitle {
            font-size: 0.95rem;
            color: var(--text2);
            letter-spacing: 1.5px;
            font-weight: 400;
        }

        .progress-wrap {
            margin-bottom: 32px;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text2);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        .progress-bar {
            height: 8px;
            background: var(--bar-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff5e2c, #ff8c3a, #ffb347);
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
            box-shadow: 0 0 14px rgba(255, 94, 44, 0.6);
        }

        .question-area {
            min-height: 320px;
            transition: opacity 0.3s ease;
        }
        .question-number {
            display: inline-block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ff9f4b;
            margin-bottom: 14px;
            font-weight: 700;
            background: rgba(255, 159, 75, 0.1);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 159, 75, 0.3);
        }
        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 28px;
            line-height: 1.6;
            color: #ffffff;
            letter-spacing: 0.4px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .option-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 18px 24px;
            background: var(--option-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: var(--text);
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all var(--transition);
            font-family: inherit;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }
        .option-btn:hover {
            background: var(--option-hover);
            border-color: rgba(255, 94, 44, 0.6);
            transform: translateX(6px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4), 0 0 15px rgba(255,94,44,0.25);
        }
        .option-btn:active {
            transform: scale(0.98);
            transition: 0.1s;
        }
        .option-btn .opt-letter {
            flex-shrink: 0;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            transition: all var(--transition);
            color: #ff9f4b;
            border: 1px solid rgba(255, 159, 75, 0.3);
        }
        .option-btn:hover .opt-letter {
            background: rgba(255, 94, 44, 0.35);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 94, 44, 0.5);
            border-color: #ff5e2c;
        }
        .option-btn .opt-text {
            flex: 1;
            line-height: 1.5;
            font-weight: 500;
        }

        /* 结果区域 */
        .result-area {
            text-align: center;
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-emoji {
            font-size: 110px;
            margin-bottom: 15px;
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 20px rgba(255, 159, 75, 0.7));
        }
        @keyframes bounceIn {
            0% { transform: scale(0.2); opacity: 0; }
            50% { transform: scale(1.15); }
            70% { transform: scale(0.85); }
            100% { transform: scale(1); opacity: 1; }
        }
        .result-band {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffd966, #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }
        .result-member {
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        .result-tagline {
            font-size: 1rem;
            color: #ffb347;
            font-style: italic;
            margin-bottom: 22px;
        }
        .result-desc {
            font-size: 1.05rem;
            color: #d0d0e0;
            line-height: 1.8;
            max-width: 620px;
            margin: 0 auto 26px;
            background: rgba(255, 255, 255, 0.03);
            padding: 22px 28px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .result-traits {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .trait-tag {
            background: rgba(255, 94, 44, 0.25);
            color: #ffb7a3;
            padding: 8px 20px;
            border-radius: 24px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            font-weight: 600;
            border: 1px solid rgba(255, 94, 44, 0.3);
        }
        .signature {
            font-size: 0.8rem;
            color: #7a7a90;
            margin-top: 28px;
            letter-spacing: 1.5px;
            font-style: italic;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 18px;
        }
        .btn {
            display: inline-block;
            padding: 14px 38px;
            border-radius: 32px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all var(--transition);
            border: none;
            font-family: inherit;
            text-transform: uppercase;
            margin: 0 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff5e2c, #d63e1e);
            color: #fff;
            box-shadow: 0 8px 28px rgba(255, 94, 44, 0.4);
        }
        .btn-primary:hover {
            box-shadow: 0 12px 34px rgba(255, 94, 44, 0.7);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        .btn-outline:hover {
            border-color: #ff9f4b;
            background: rgba(255, 159, 75, 0.1);
            color: #ff9f4b;
        }

        @media (max-width: 600px) {
            .container {
                padding: 32px 20px 28px;
                border-radius: 22px;
            }
            .header h1 { font-size: 1.7rem; }
            .header .icon-row { font-size: 40px; }
            .question-text { font-size: 1.2rem; }
            .option-btn { padding: 15px 16px; font-size: 0.95rem; gap: 12px; }
            .option-btn .opt-letter { width: 36px; height: 36px; font-size: 0.85rem; }
            .result-emoji { font-size: 80px; }
            .result-member { font-size: 1.8rem; }
            .result-band { font-size: 1.3rem; }
            .btn { padding: 12px 24px; font-size: 0.9rem; }
        }
    </style>
</head>

                    { text: '存起来，看着数字增长给我安全感。', scores: [[4,2],[9,2],[14,1]] },
                    { text: '买下那件心仪已久的乐器/相机/艺术品。', scores: [[5,2],[15,2],[1,1]] },
                ],
            }, {
                q: '最后一道题：你认为生活是什么？',
                options: [
                    { text: '一场盛大的冒险，我要活得轰轰烈烈。', scores: [[0,2],[8,2],[3,1]] },
                    { text: '一首未完成的歌，需要我自己填词作曲。', scores: [[14,2],[19,2],[16,1]] },
                    { text: '一段不知终点的旅程，重要的是沿途的风景和同行的人。', scores: [[6,2],[13,2],[1,1]] },
                    { text: '一次不断认识自己的过程，痛苦与美丽并存。', scores: [[12,2],[15,2],[4,1]] },
                ],
            }];

            // 状态管理与交互
            let currentQuestion = 0;
            let scores = new Array(members.length).fill(0);
            let answered = false;

            const contentArea = document.getElementById('contentArea');
            const progressFill = document.getElementById('progressFill');
            const progressLabel = document.getElementById('progressLabel');
            const progressPercent = document.getElementById('progressPercent');

            function updateProgress() {
                const pct = Math.round((currentQuestion / questions.length) * 100);
                progressFill.style.width = pct + '%';
                progressLabel.textContent = `第 ${currentQuestion + 1} / ${questions.length} 题`;
                progressPercent.textContent = pct + '%';
            }

            function renderQuestion() {
                if (currentQuestion >= questions.length) {
                    showResult();
                    return;
                }
                answered = false;
                updateProgress();
                const q = questions[currentQuestion];
                let html = '<div class="question-area">';
                html += `<span class="question-number">Question ${currentQuestion + 1}</span>`;
                html += `<p class="question-text">${q.q}</p>`;
                html += '<div class="options-list">';
                const letters = ['A', 'B', 'C', 'D'];
                q.options.forEach((opt, i) => {
                    html += `
                        <button class="option-btn" data-index="${i}" data-letter="${letters[i]}">
                            <span class="opt-letter">${letters[i]}</span>
                            <span class="opt-text">${opt.text}</span>
                        </button>`;
                });
                html += '</div></div>';
                contentArea.innerHTML = html;

                const buttons = contentArea.querySelectorAll('.option-btn');
                buttons.forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (answered) return;
                        answered = true;
                        const idx = parseInt(this.getAttribute('data-index'));
                        buttons.forEach(b => b.style.cssText = 'pointer-events:none;opacity:0.5;');
                        this.style.cssText =
                            'border-color:#ff5e2c !important;background:rgba(255,94,44,0.2) !important;opacity:1 !important;pointer-events:none;box-shadow:0 0 20px rgba(255,94,44,0.7);';
                        this.querySelector('.opt-letter').style.background = 'rgba(255,94,44,0.5)';
                        this.querySelector('.opt-letter').style.color = '#fff';
                        const chosenScores = q.options[idx].scores;
                        chosenScores.forEach(([memberId, points]) => {
                            scores[memberId] += points;
                        });
                        setTimeout(() => {
                            currentQuestion++;
                            renderQuestion();
                        }, 400);
                    });
                });
            }

            function showResult() {
                updateProgress();
                progressFill.style.width = '100%';
                progressLabel.textContent = '🎯 结果揭晓！';
                progressPercent.textContent = '100%';
                let maxScore = -1;
                let winnerIdx = 0;
                const maxIndices = [];
                scores.forEach((s, i) => {
                    if (s > maxScore) {
                        maxScore = s;
                        maxIndices.length = 0;
                        maxIndices.push(i);
                    } else if (s === maxScore) {
                        maxIndices.push(i);
                    }
                });
                winnerIdx = maxIndices[Math.floor(Math.random() * maxIndices.length)];
                const winner = members[winnerIdx];
                let html = '<div class="result-area">';
                html += `<div class="result-emoji">${winner.emoji}</div>`;
                html += `<p class="result-band">${winner.band}</p>`;
                html += `<p class="result-member">${winner.name} <span style="font-size:0.85rem;color:#aaa;">(${winner.role})</span></p>`;
                html += `<p class="result-tagline">"${winner.tagline}"</p>`;
                html += `<p class="result-desc">${winner.desc}</p>`;
                html += '<div class="result-traits">';
                winner.traits.forEach(t => {
                    html += `<span class="trait-tag">${t}</span>`;
                });
                html += '</div>';
                html += `
                    <button class="btn btn-primary" onclick="location.reload()">🔄 重新测试</button>
                    <button class="btn btn-outline" id="btnShare">📋 复制结果</button>
                `;
                html += '<p class="signature">——made by StonePumpkins</p>';
                html += '</div>';
                contentArea.innerHTML = html;

                setTimeout(() => {
                    const shareBtn = document.getElementById('btnShare');
                    if (shareBtn) {
                        shareBtn.addEventListener('click', () => {
                            const shareText = `🎸 摇滚人格测试结果：我最像【${winner.band}】的 ${winner.name}（${winner.role}）！"${winner.tagline}" 来看看你骨子里是哪个摇滚灵魂？ ——made by StonePumpkins`;
                            if (navigator.clipboard) {
                                navigator.clipboard.writeText(shareText).then(() => {
                                    shareBtn.textContent = '✅ 已复制！';
                                    setTimeout(() => {
                                        shareBtn.textContent = '📋 复制结果';
                                    }, 2000);
                                });
                            } else {
                                alert(shareText);
                            }
                        });
                    }
                }, 100);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                document.getElementById('app').scrollIntoView({ behavior: 'smooth' });
            }

            updateProgress();
            renderQuestion();
        })();
    </script>
</body>
</html>
