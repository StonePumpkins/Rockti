<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCKTI</title>
    <style>
        :root {
            --bg-deep: #060f1c;
            --bg-mid: #0b1a2f;
            --bg-light: #0f2340;
            --text-primary: #e8edf3;
            --text-secondary: #b0c4d8;
            --text-muted: #6b8aab;
            --accent-gold: #c9a96e;
            --accent-gold-light: #e0c78a;
            --accent-blue: #5b8db8;
            --accent-warm: #d4956b;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
            --option-bg: rgba(255, 255, 255, 0.03);
            --option-hover-bg: rgba(255, 255, 255, 0.07);
            --option-selected-bg: rgba(201, 169, 110, 0.12);
            --shadow-glow: 0 0 40px rgba(100, 150, 200, 0.15);
            --font-display: 'Georgia', 'Times New Roman', 'STSong', 'Songti SC', 'Noto Serif SC', serif;
            --font-body: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
            --transition-smooth: 0.45s cubic-bezier(0.25, 0.1, 0.25, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ============ Canvas 星空背景 ============ */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ============ 主容器 ============ */
        #app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* ============ 顶部进度区域 ============ */
        .progress-area {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            padding: 18px 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .progress-area.hidden {
            opacity: 0;
        }
        .progress-track {
            flex: 1;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent-gold);
            border-radius: 2px;
            transition: width 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent-gold-light);
            box-shadow: 0 0 10px var(--accent-gold-light), 0 0 20px rgba(201, 169, 110, 0.6);
        }
        .progress-count {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            font-family: var(--font-display);
            white-space: nowrap;
            min-width: 55px;
            text-align: right;
        }
        .progress-count .current {
            color: var(--accent-gold-light);
            font-size: 1.15rem;
            font-weight: bold;
        }

        /* ============ 屏幕（题目/欢迎/结果） ============ */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 60px 30px 60px;
            transition: opacity 0.55s ease, transform 0.55s ease;
            pointer-events: none;
            opacity: 0;
            transform: translateY(18px);
        }
        .screen.active {
            pointer-events: auto;
            opacity: 1;
            transform: translateY(0);
        }
        .screen.exit-up {
            opacity: 0;
            transform: translateY(-24px);
        }

        /* ============ 欢迎页 ============ */
        .welcome-inner {
            text-align: center;
            max-width: 620px;
            width: 100%;
        }
        .welcome-icon {
            font-size: 4.5rem;
            margin-bottom: 10px;
            animation: gentleFloat 4s ease-in-out infinite;
            display: block;
            filter: drop-shadow(0 8px 24px rgba(180, 160, 120, 0.3));
        }
        @keyframes gentleFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-14px);
            }
        }
        .welcome-title {
            font-family: var(--font-display);
            font-size: 2.8rem;
            font-weight: 400;
            letter-spacing: 0.06em;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.25;
        }
        .welcome-title .accent {
            color: var(--accent-gold-light);
            font-style: italic;
        }
        .welcome-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            margin-bottom: 36px;
            font-family: var(--font-display);
        }
        .welcome-divider {
            width: 60px;
            height: 1px;
            background: var(--accent-gold);
            margin: 0 auto 32px;
            opacity: 0.6;
        }
        .welcome-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 38px;
            letter-spacing: 0.03em;
        }
        .btn-start {
            display: inline-block;
            padding: 15px 50px;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold-light);
            background: transparent;
            font-size: 1rem;
            letter-spacing: 0.12em;
            cursor: pointer;
            font-family: var(--font-display);
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
        }
        .btn-start:hover {
            background: rgba(201, 169, 110, 0.08);
            border-color: var(--accent-gold-light);
            box-shadow: 0 0 30px rgba(201, 169, 110, 0.2);
            letter-spacing: 0.16em;
        }
        .btn-start:active {
            transform: scale(0.96);
            transition: 0.1s;
        }

        /* ============ 题目页 ============ */
        .question-inner {
            max-width: 680px;
            width: 100%;
            text-align: center;
        }
        .question-number-indicator {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            font-family: var(--font-display);
        }
        .question-text {
            font-family: var(--font-display);
            font-size: 1.7rem;
            font-weight: 400;
            line-height: 1.5;
            color: var(--text-primary);
            margin-bottom: 40px;
            letter-spacing: 0.04em;
            transition: all var(--transition-smooth);
        }
        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 17px 24px;
            background: var(--option-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: all var(--transition-smooth);
            position: relative;
            font-family: var(--font-body);
            line-height: 1.5;
        }
        .option-btn:hover {
            background: var(--option-hover-bg);
            border-color: var(--border-hover);
            color: #fff;
            transform: translateX(3px);
            box-shadow: 0 0 20px rgba(120, 160, 200, 0.1);
        }
        .option-btn:active {
            transform: scale(0.98);
            transition: 0.1s;
        }
        .option-btn.selected-flash {
            background: var(--option-selected-bg);
            border-color: var(--accent-gold);
            color: #fff;
            animation: optionPulse 0.5s ease-out;
        }
        @keyframes optionPulse {
            0% {
                box-shadow: 0 0 0 rgba(201, 169, 110, 0.5);
            }
            100% {
                box-shadow: 0 0 30px rgba(201, 169, 110, 0);
            }
        }
        .option-letter {
            display: inline-block;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-right: 14px;
            font-size: 0.8rem;
            letter-spacing: 0;
            color: var(--text-muted);
            flex-shrink: 0;
            transition: all var(--transition-smooth);
        }
        .option-btn:hover .option-letter {
            border-color: var(--accent-gold);
            color: var(--accent-gold-light);
        }

        /* ============ 过渡动画 ============ */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            background: radial-gradient(ellipse at center, rgba(201, 169, 110, 0.06) 0%, transparent 70%);
            transition: opacity 0.35s ease;
        }
        .transition-overlay.flash {
            opacity: 1;
            transition: opacity 0.05s ease;
        }

        /* ============ 结果页 ============ */
        .result-inner {
            text-align: center;
            max-width: 640px;
            width: 100%;
            animation: resultFadeIn 0.8s ease-out;
        }
        @keyframes resultFadeIn {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .result-badge {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 10px;
            font-family: var(--font-display);
        }
        .result-name {
            font-family: var(--font-display);
            font-size: 3.2rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .result-band {
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            margin-bottom: 6px;
            font-style: italic;
        }
        .result-match-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 18px 0;
        }
        .result-match-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-gold);
        }
        .result-match-line {
            width: 100px;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }
        .result-match-percent {
            font-size: 1.6rem;
            color: var(--accent-gold-light);
            font-family: var(--font-display);
            letter-spacing: 0.04em;
        }
        .result-divider {
            width: 40px;
            height: 1px;
            background: rgba(255, 255, 255, 0.25);
            margin: 20px auto;
        }
        .result-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.8;
            letter-spacing: 0.03em;
            max-width: 500px;
            margin: 0 auto 24px;
        }
        .result-runnerups {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .runnerup-item {
            text-align: center;
            opacity: 0.7;
        }
        .runnerup-name {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: var(--font-display);
            letter-spacing: 0.04em;
        }
        .runnerup-percent {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .btn-retry {
            display: inline-block;
            padding: 12px 36px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--text-secondary);
            background: transparent;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            font-family: var(--font-display);
            transition: all var(--transition-smooth);
            text-transform: uppercase;
        }
        .btn-retry:hover {
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 24px rgba(200, 200, 220, 0.15);
        }
        .result-madeby {
            margin-top: 30px;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            opacity: 0.6;
            font-family: var(--font-display);
        }

        /* ============ 响应式 ============ */
        @media (max-width: 768px) {
            .welcome-title {
                font-size: 2rem;
            }
            .question-text {
                font-size: 1.3rem;
                margin-bottom: 28px;
            }
            .option-btn {
                padding: 14px 18px;
                font-size: 0.85rem;
            }
            .option-letter {
                width: 24px;
                height: 24px;
                line-height: 24px;
                font-size: 0.7rem;
                margin-right: 10px;
            }
            .result-name {
                font-size: 2.2rem;
            }
            .screen {
                padding: 50px 18px 50px;
            }
            .progress-area {
                padding: 12px 16px;
                gap: 10px;
            }
            .progress-count {
                font-size: 0.7rem;
                min-width: 45px;
            }
            .result-runnerups {
                gap: 16px;
            }
        }
        @media (max-width: 400px) {
            .welcome-title {
                font-size: 1.6rem;
            }
            .question-text {
                font-size: 1.1rem;
                margin-bottom: 22px;
            }
            .option-btn {
                padding: 12px 14px;
                font-size: 0.78rem;
                gap: 10px;
            }
            .option-letter {
                width: 22px;
                height: 22px;
                line-height: 22px;
                font-size: 0.65rem;
                margin-right: 8px;
            }
            .result-name {
                font-size: 1.7rem;
            }
            .btn-start {
                padding: 13px 36px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- 星空Canvas -->
    <canvas id="starCanvas"></canvas>

    <!-- 过渡闪光层 -->
    <div class="transition-overlay" id="transitionOverlay"></div>

    <!-- 顶部进度 -->
    <div class="progress-area hidden" id="progressArea">
        <div class="progress-track">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>
        <div class="progress-count"><span class="current" id="progressCurrent">1</span> / 30</div>
    </div>

    <!-- 主应用容器 -->
    <div id="app-container">
        <!-- 欢迎页 -->
        <div class="screen active" id="screenWelcome">
            <div class="welcome-inner">
                <span class="welcome-icon">🎸</span>
                <h1 class="welcome-title">你骨子里是<br>哪个<span class="accent">摇滚传奇</span>？</h1>
                <div class="welcome-divider"></div>
                <p class="welcome-desc">
                    30道情景题，探测你灵魂深处的摇滚人格。<br>
                    It's better to burn out than to fade away<br>
                    虔诚选择，让答案浮现。
                </p>
                <button class="btn-start" id="btnStart" onclick="startQuiz()">开始测试</button>
            </div>
        </div>

        <!-- 题目页 -->
        <div class="screen" id="screenQuestion">
            <div class="question-inner">
                <div class="question-number-indicator" id="questionNumberInd">第 1 题</div>
                <div class="question-text" id="questionText"></div>
                <ul class="options-list" id="optionsList"></ul>
            </div>
        </div>

        <!-- 结果页 -->
        <div class="screen" id="screenResult">
            <div class="result-inner" id="resultInner"></div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 星空Canvas ====================
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d');
            let stars = [];
            let shootingStars = [];
            let animId;
            const STAR_COUNT = 180;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                initStars();
            });

            function initStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        r: Math.random() * 2.2 + 0.4,
                        twinkleSpeed: Math.random() * 0.015 + 0.004,
                        twinkleOffset: Math.random() * Math.PI * 2,
                        baseAlpha: Math.random() * 0.7 + 0.3,
                        driftX: (Math.random() - 0.5) * 0.15,
                        driftY: (Math.random() - 0.5) * 0.1,
                    });
                }
                stars.sort((a, b) => a.r - b.r);
            }

            function spawnShootingStar() {
                if (Math.random() < 0.012 && shootingStars.length < 2) {
                    const fromLeft = Math.random() > 0.5;
                    shootingStars.push({
                        x: fromLeft ? Math.random() * canvas.width * 0.3 : canvas.width * 0.7 + Math.random() *
                            canvas.width * 0.3,
                        y: Math.random() * canvas.height * 0.35,
                        vx: (fromLeft ? 1 : -1) * (Math.random() * 2.5 + 2),
                        vy: Math.random() * 1.8 + 0.8,
                        life: 1,
                        decay: Math.random() * 0.025 + 0.018,
                        trail: [],
                        maxTrail: Math.floor(Math.random() * 35 + 20),
                    });
                }
            }

            function updateShootingStars() {
                for (let i = shootingStars.length - 1; i >= 0; i--) {
                    const ss = shootingStars[i];
                    ss.trail.push({ x: ss.x, y: ss.y, life: ss.life });
                    if (ss.trail.length > ss.maxTrail) ss.trail.shift();
                    ss.x += ss.vx;
                    ss.y += ss.vy;
                    ss.life -= ss.decay;
                    if (ss.life <= 0 || ss.x < -50 || ss.x > canvas.width + 50 || ss.y > canvas.height + 50) {
                        shootingStars.splice(i, 1);
                    }
                }
            }

            function drawStars(time) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 深蓝渐变底色
                const grad = ctx.createRadialGradient(canvas.width * 0.4, canvas.height * 0.35, 0, canvas.width * 0.5,
                    canvas.height * 0.5, Math.max(canvas.width, canvas.height) * 0.75);
                grad.addColorStop(0, '#0e2540');
                grad.addColorStop(0.5, '#091a2d');
                grad.addColorStop(1, '#040d18');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 星星
                for (const s of stars) {
                    const alpha = s.baseAlpha + Math.sin(time * s.twinkleSpeed + s.twinkleOffset) * 0.3;
                    const clampedAlpha = Math.max(0.15, Math.min(1, alpha));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(210,225,245,${clampedAlpha})`;
                    ctx.fill();
                    // 微光晕
                    if (s.r > 1.4) {
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * 2.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(180,200,230,${clampedAlpha*0.18})`;
                        ctx.fill();
                    }
                    // 漂移
                    s.x += s.driftX * 0.02;
                    s.y += s.driftY * 0.02;
                    if (s.x < -10) s.x = canvas.width + 10;
                    if (s.x > canvas.width + 10) s.x = -10;
                    if (s.y < -10) s.y = canvas.height + 10;
                    if (s.y > canvas.height + 10) s.y = -10;
                }

                // 流星
                for (const ss of shootingStars) {
                    if (ss.trail.length > 1) {
                        for (let j = 1; j < ss.trail.length; j++) {
                            const t = ss.trail[j];
                            const alpha = (j / ss.trail.length) * ss.life * 0.8;
                            ctx.beginPath();
                            ctx.arc(t.x, t.y, 1.2, 0, Math.PI * 2);
                            ctx.fillStyle = `rgba(255,240,220,${Math.max(0,alpha)})`;
                            ctx.fill();
                        }
                    }
                    // 头部
                    ctx.beginPath();
                    ctx.arc(ss.x, ss.y, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,250,240,${Math.max(0,ss.life)})`;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ss.x, ss.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,240,220,${Math.max(0,ss.life*0.35)})`;
                    ctx.fill();
                }
            }

            function animateStars(time) {
                spawnShootingStar();
                updateShootingStars();
                drawStars(time);
                animId = requestAnimationFrame(animateStars);
            }

            initStars();
            animId = requestAnimationFrame(animateStars);

            // ==================== 数据定义 ====================
            const rockStars = {
                'freddie_mercury': {
                    name: 'Freddie Mercury',
                    band: 'Queen',
                    emoji: '👑',
                    desc: '你拥有无法抑制的舞台魅力和对生命的热爱。在人群中你自然地成为焦点，用幽默与戏剧性点燃每一个房间。你相信“人生苦短，必须尽兴”，对美有着执着的追求，无论是视觉还是情感，你都希望达到极致。你的自信有时被误解为张扬，但了解你的人都知道，你内心深处的慷慨与温暖才是真正的底色。',
                },
                'john_lennon': {
                    name: 'John Lennon',

                    { text: '汹涌的海浪——力量与不可预测', map: 'axl_rose' },
                    { text: '雾中的树林——神秘而情感丰富', map: 'robert_smith' },
                ],
            }, {
                q: '朋友遇到困难时，你通常会？',
                options: [
                    { text: '给出犀利但有用的建议', map: 'noel_gallagher' },
                    { text: '默默陪伴，让ta知道你在', map: 'slash' },
                    { text: '用自己的经历鼓励ta', map: 'patti_smith' },
                    { text: '帮ta分析问题的根源', map: 'roger_waters' },
                ],
            }, {
                q: '你更倾向于哪种表达爱的方式？',
                options: [
                    { text: '热烈直接，爱就要大声说出来', map: 'freddie_mercury' },
                    { text: '细腻的行动，胜过千言万语', map: 'david_gilmour' },
                    { text: '写一封长信或一首诗', map: 'robert_smith' },
                    { text: '在关键时刻坚定地站在ta身边', map: 'keith_richards' },
                ],
            }, {
                q: '对于“流行趋势”，你的态度是？',
                options: [
                    { text: '引领趋势而非追随趋势', map: 'billy_corgan' },
                    { text: '大部分趋势都很无聊', map: 'thom_yorke' },
                    { text: '挑自己喜欢的部分，不完全拒绝也不盲从', map: 'david_gilmour' },
                    { text: '完全不在意，我有自己的风格', map: 'slash' },
                ],
            }, {
                q: '你最大的缺点可能是？',
                options: [
                    { text: '太强势，有时候会压倒别人', map: 'axl_rose' },
                    { text: '太敏感，容易想太多', map: 'kurt_cobain' },
                    { text: '太固执，听不进不同意见', map: 'liam_gallagher' },
                    { text: '太冷漠，让人觉得难以接近', map: 'roger_waters' },
                ],
            }, {
                q: '回顾你的人生，你最自豪的会是？',
                options: [
                    { text: '我从未背叛过自己的真实', map: 'kurt_cobain' },
                    { text: '我按自己的方式活了一辈子', map: 'keith_richards' },
                    { text: '我创造了一些能留下来影响后世的东西', map: 'john_lennon' },
                    { text: '我在最困难的时候也没有放弃', map: 'patti_smith' },
                ],
            }, {
                q: '最后一道题——摇滚精神对你来说是什么？',
                options: [
                    { text: '毫无保留地燃烧自己', map: 'freddie_mercury' },
                    { text: '对虚伪的世界说“不”', map: 'john_lennon' },
                    { text: '做最真实的自己，无论代价', map: 'kurt_cobain' },
                    { text: '在混乱中找到属于自己的节奏', map: 'keith_richards' },
                ],
            }, ];

            // ==================== 状态管理 ====================
            let currentQuestionIndex = 0;
            let scores = {};
            let quizStarted = false;
            let quizFinished = false;
            let isTransitioning = false;

            // 初始化所有明星分数
            function resetScores() {
                scores = {};
                for (const key in rockStars) {
                    scores[key] = 0;
                }
            }
            resetScores();

            // ==================== DOM元素 ====================
            const screenWelcome = document.getElementById('screenWelcome');
            const screenQuestion = document.getElementById('screenQuestion');
            const screenResult = document.getElementById('screenResult');
            const progressArea = document.getElementById('progressArea');
            const progressFill = document.getElementById('progressFill');
            const progressCurrent = document.getElementById('progressCurrent');
            const questionText = document.getElementById('questionText');
            const optionsList = document.getElementById('optionsList');
            const questionNumberInd = document.getElementById('questionNumberInd');
            const resultInner = document.getElementById('resultInner');
            const transitionOverlay = document.getElementById('transitionOverlay');

            function switchScreen(fromScreen, toScreen, callback) {
                if (fromScreen) {
                    fromScreen.classList.remove('active');
                    fromScreen.classList.add('exit-up');
                    setTimeout(() => {
                        fromScreen.classList.remove('exit-up');
                    }, 550);
                }
                setTimeout(() => {
                    if (toScreen) {
                        toScreen.classList.add('active');
                    }
                    if (callback) callback();
                }, 200);
            }

            function flashOverlay() {
                transitionOverlay.classList.add('flash');
                setTimeout(() => {
                    transitionOverlay.classList.remove('flash');
                }, 120);
            }

            // ==================== 渲染题目 ====================
            function renderQuestion(index) {
                if (index >= questions.length) {
                    finishQuiz();
                    return;
                }
                const qData = questions[index];
                questionText.textContent = qData.q;
                questionNumberInd.textContent = `第 ${index + 1} 题`;
                optionsList.innerHTML = '';
                const letters = ['A', 'B', 'C', 'D'];
                qData.options.forEach((opt, i) => {
                    const li = document.createElement('li');
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML =
                        `<span class="option-letter">${letters[i]}</span><span>${opt.text}</span>`;
                    btn.addEventListener('click', () => {
                        if (isTransitioning) return;
                        selectOption(index, opt.map, btn);
                    });
                    li.appendChild(btn);
                    optionsList.appendChild(li);
                });
                updateProgress(index);
            }

            function updateProgress(index) {
                const pct = ((index) / questions.length) * 100;
                progressFill.style.width = pct + '%';
                progressCurrent.textContent = index + 1;
            }

            function selectOption(index, starKey, btnElement) {
                if (isTransitioning) return;
                isTransitioning = true;

                // 加分
                if (scores[starKey] !== undefined) {
                    scores[starKey] += 1;
                }

                // 选中动画
                btnElement.classList.add('selected-flash');
                flashOverlay();

                // 禁用所有按钮
                const allBtns = optionsList.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.style.pointerEvents = 'none');

                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < questions.length) {
                        renderQuestion(currentQuestionIndex);
                        // 重新启用按钮
                        const newBtns = optionsList.querySelectorAll('.option-btn');
                        newBtns.forEach(b => b.style.pointerEvents = 'auto');
                        isTransitioning = false;
                    } else {
                        finishQuiz();
                        isTransitioning = false;
                    }
                }, 380);
            }

            // ==================== 开始测试 ====================
            function startQuiz() {
                if (quizStarted) return;
                quizStarted = true;
                resetScores();
                currentQuestionIndex = 0;
                quizFinished = false;
                progressArea.classList.remove('hidden');
                updateProgress(0);
                switchScreen(screenWelcome, screenQuestion, () => {
                    renderQuestion(0);
                });
            }

            // ==================== 完成测试 ====================
            function finishQuiz() {
                if (quizFinished) return;
                quizFinished = true;
                progressFill.style.width = '100%';
                progressCurrent.textContent = '30';

                // 计算排名
                const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
                const topStar = sorted[0];
                const runnerUps = sorted.slice(1, 4);
                const maxScore = topStar[1];
                const totalPossible = questions.length;
                const percentage = Math.round((maxScore / totalPossible) * 100);

                const starData = rockStars[topStar[0]];

                setTimeout(() => {
                    switchScreen(screenQuestion, screenResult, () => {
                        progressArea.classList.add('hidden');
                        displayResult(starData, percentage, runnerUps, maxScore, totalPossible);
                    });
                }, 300);
            }

            function displayResult(starData, percentage, runnerUps, maxScore, totalPossible) {
                let runnerUpHTML = '';
                runnerUps.forEach(([key, score]) => {
                    if (score > 0) {
                        const rpct = Math.round((score / totalPossible) * 100);
                        runnerUpHTML += `
                            <div class="runnerup-item">
                                <div class="runnerup-name">${rockStars[key].name}</div>
                                <div class="runnerup-percent">${rpct}% 匹配</div>
                            </div>`;
                    }
                });

                resultInner.innerHTML = `
                    <div class="result-badge">你的摇滚灵魂</div>
                    <div style="font-size:5rem;display:block;margin:8px 0;filter:drop-shadow(0 8px 20px rgba(200,170,120,0.35));">${starData.emoji}</div>
                    <div class="result-name">${starData.name}</div>
                    <div class="result-band">${starData.band}</div>
                    <div class="result-match-bar">
                        <div class="result-match-dot"></div>
                        <div class="result-match-line"></div>
                        <div class="result-match-percent">${percentage}% 匹配</div>
                        <div class="result-match-line"></div>
                        <div class="result-match-dot"></div>
                    </div>
                    <div class="result-divider"></div>
                    <p class="result-desc">${starData.desc}</p>
                    ${runnerUpHTML ? `
                    <div style="font-size:0.75rem;color:var(--text-muted);letter-spacing:0.1em;margin-bottom:12px;font-family:var(--font-display);">其他接近的匹配</div>
                    <div class="result-runnerups">${runnerUpHTML}</div>` : ''}
                    <button class="btn-retry" onclick="retryQuiz()">重新测试</button>
                    <div class="result-madeby">——made by StonePumpkins</div>
                    <div class="result-madeby" style="font-size: 0.9rem; letter-spacing: 0.08em;">
    If you like the quiz, please support me on 
    <a href="https://github.com/StonePumpkins/Rockti" target="_blank" style="color: #c9a96e; text-decoration: none; border-bottom: 1px dotted rgba(201,169,110,0.4);">github</a> 
    by giving a star
</div>
                `;
            }

            function retryQuiz() {
                resetScores();
                currentQuestionIndex = 0;
                quizFinished = false;
                quizStarted = true;
                progressArea.classList.remove('hidden');
                updateProgress(0);
                switchScreen(screenResult, screenQuestion, () => {
                    renderQuestion(0);
                });
            }

            // 暴露到全局
            window.startQuiz = startQuiz;
            window.retryQuiz = retryQuiz;

            // ==================== 键盘支持 ====================
            document.addEventListener('keydown', (e) => {
                if (!quizStarted || quizFinished || isTransitioning) return;
                if (currentQuestionIndex >= questions.length) return;
                const key = e.key.toLowerCase();
                const map = { 'a': 0, 'b': 1, 'c': 2, 'd': 3, '1': 0, '2': 1, '3': 2, '4': 3 };
                if (map[key] !== undefined) {
                    const btns = optionsList.querySelectorAll('.option-btn');
                    if (btns[map[key]]) {
                        btns[map[key]].click();
                    }
                }
            });

            // ==================== 初始化 ====================
            screenWelcome.classList.add('active');
            console.log('%c🎸 摇滚灵魂测试已就绪 %c——made by StonePumpkins',
                'font-size:1.2em;color:#c9a96e;', 'color:#b0c4d8;');
            console.log('%c按 A/B/C/D 或 1/2/3/4 键可以快速选择选项', 'color:#6b8aab;font-style:italic;');
        })();
    </script>
</body>
</html>
